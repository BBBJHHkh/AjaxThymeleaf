<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>实时监控子页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff;
            margin: 0;
            padding: 15px;
        }
        .card {
            background: #eef2f7;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #007bff;
        }
        .number { font-size: 24px; font-weight: bold; color: #28a745; }
    </style>
</head>
<body>

    <div class="card">
        <h3>📊 实时监控卡片 (Sub Page)</h3>
        <p>当前活跃用户数: <span class="number" th:text="${activeUsers}">0</span></p>
        <p>系统状态: <span style="color: blue;" th:text="${systemStatus}">未知</span></p>
        <p style="font-size: 12px; color: #666;">
            提示：这个小卡片是一个独立的 HTML，通过独立请求加载进来的（被 &lt;iframe&gt; 嵌入）。
        </p>
    </div>

</body>
</html>
