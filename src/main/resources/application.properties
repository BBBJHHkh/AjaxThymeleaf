## 静态资源缓存策略
# Spring MVC 默认对 /resources/** 走 304 协商缓存（看 ETag + Last-Modified）
# 开发时如果你觉得浏览器太顽固，可选地：打开 LiveReload，或在浏览器 DevTools 勾选 "Disable cache"
# 不要简单粗暴关掉所有缓存——会丢掉生产环境的浏览器缓存加速效果

## Dev profile 专用配置（推荐日常开发用）
# 启用 dev profile 会带来以下三个好处：
#   1. Thymeleaf 模板默认关闭缓存（改了 .html 立即生效）
#   2. devtools 给静态资源加 Cache-Control: no-cache, no-store（改了 .js / .css 立即生效）
#   3. LiveReload 启动后改文件自动刷新浏览器（端口被占用时只在日志提示，不影响功能）
#
# 启用方式（任选其一）：
#   A) 取消下面这行注释（适合临时启用）
#   B) Edit Configurations → VM options 加 -Dspring.profiles.active=dev（适合长期启用）
#
# 注意：dev profile 与 Login 无关，不会清掉 Cookie / Session / Remember-Me。
#       "改 Java 代码被踢回登录页" 的真实原因是：devtools 重启 Spring → Session 内存被清空。
#       这是 Spring Security 默认行为，不影响 permitAll 页面（如 /thymeleaf/excel-upload/**）。
spring.profiles.active=dev
